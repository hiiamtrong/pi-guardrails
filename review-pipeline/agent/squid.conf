# Default deny: a request whose host is not listed below is refused, whatever port or scheme it asks for.
acl allowed dstdomain .github.com .githubusercontent.com .anthropic.com .opencode.ai .notion.com
acl ssl_ports port 443
http_access allow allowed ssl_ports
http_access deny all
# No cache: nothing from a private repository stays on disk for the next PR to read.
cache deny all
# Not a proxy for other pods: only the agent's jobs reach it (NetworkPolicy), and only for the hosts above.
http_port 3128
# As the unprivileged squid user: the runtime dirs it opens by default are root's.
pid_filename /tmp/squid.pid
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log /dev/stderr
