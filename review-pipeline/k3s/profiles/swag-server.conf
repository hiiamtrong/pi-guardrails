# What rv_k3s.sh and build_image.sh need to know about a swag-server pod.
RV_IMAGE=rv-swag-server:dev
RV_WORKDIR=/usr/src/app
# Printed, not run: the commands the node runs in the unpacked checkout. The project's own dev image first, then the test tools on top of it.
rv_build() { echo "DOCKER_BUILDKIT=1 docker build --target dev -t $RV_IMAGE-base . && docker build -f Dockerfile.review --build-arg BASE=$RV_IMAGE-base -t $RV_IMAGE ."; }
